<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BeautyShorts</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; background: #100d18; color: #f7f2ff; line-height: 1.72; }
    main { max-width: 880px; margin: 0 auto; padding: 48px 18px 72px; }
    h1 { margin: 0 0 10px; font-size: clamp(2.2rem, 9vw, 4.5rem); line-height: 1.02; letter-spacing: -.04em; color: #f3b2ff; }
    p { margin: 0 0 18px; }
    a { color: #f3b2ff; }
    .sub { max-width: 650px; color: #c9bfd8; font-size: 1.06rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 30px; }
    .card { display: block; min-height: 146px; padding: 19px; color: inherit; text-decoration: none; background: linear-gradient(145deg, rgba(243,178,255,.15), rgba(102,79,175,.10)), #191423; border: 1px solid rgba(243,178,255,.35); border-radius: 16px; }
    .card strong { display: block; margin-bottom: 8px; color: #f3b2ff; font-size: 1.08rem; }
    footer { margin-top: 42px; color: #9a8fa8; font-size: .92rem; }
  </style>
</head>
<body>
  <main>
    <h1>BeautyShorts</h1>
    <p class="sub">一款围绕短视频灵感发现、收藏、私密笔记与私人灵感板设计的 iOS 应用。本页面提供公开的隐私、使用条款与支持信息。</p>
    <div class="grid">
      <a class="card" href="./privacy.html">
        <strong>隐私政策</strong>
        <span>了解本应用如何处理设备本地数据、网络请求和支持邮件。</span>
      </a>
      <a class="card" href="./terms.html">
        <strong>用户协议</strong>
        <span>了解使用规则、内容权利和服务边界。</span>
      </a>
      <a class="card" href="./support.html">
        <strong>技术支持</strong>
        <span>查看常见问题、清除本地数据的方法与联系渠道。</span>
      </a>
    </div>
    <footer>© 2026 BeautyShorts</footer>
  </main>
</body>
</html>
